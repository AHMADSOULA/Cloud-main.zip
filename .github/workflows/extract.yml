name: Extract Cloud-main ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Cloud-main.zip
        run: |
          python3 - <<'PY'
          import os
          import zipfile

          zip_path = "Cloud-main.zip"

          if not os.path.isfile(zip_path):
              raise FileNotFoundError(
                  "Cloud-main.zip was not found in the repository root."
              )

          with zipfile.ZipFile(zip_path, "r") as archive:
              archive.extractall(".")

          print("Cloud-main.zip extracted successfully.")
          PY

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted-file changes to commit."
          else
            git commit -m "Extract Cloud-main.zip"
            git push
          fi
