name: Extract Cloud-main ZIP

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل ملفات المستودع
        uses: actions/checkout@v4

      - name: فك ضغط Cloud-main.zip
        run: |
          python3 - <<'PY'
          import zipfile
          import os

          zip_file = "Cloud-main.zip"

          if not os.path.exists(zip_file):
              raise FileNotFoundError("Cloud-main.zip غير موجود")

          with zipfile.ZipFile(zip_file, "r") as z:
              z.extractall(".")

          print("تم فك الضغط بنجاح")
          PY

      - name: حفظ الملفات في GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Extract Cloud-main.zip"
          git push
